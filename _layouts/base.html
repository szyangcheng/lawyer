<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142e3b">
  {% seo %}
  {% feed_meta %}
  <link rel="alternate" hreflang="zh-Hans" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="zh-Hant" href="{{ page.url | prepend: '/zh-hant' | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ page.url | prepend: '/en' | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/lawyer.css' | relative_url }}">
  <script src="{{ '/assets/js/lawyer.js' | relative_url }}" defer></script>
{% if site.google_analytics %}{% include google-analytics.html %}{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">跳至正文</a>
  {% include header.html %}
  <div class="container language-bar"><nav aria-label="语言 / Language"><a lang="zh-Hans" hreflang="zh-Hans" href="{{ page.url | relative_url }}" aria-current="true">简体中文</a><a lang="zh-Hant" hreflang="zh-Hant" href="{{ page.url | prepend: '/zh-hant' | relative_url }}">繁體中文</a><a lang="en" hreflang="en" href="{{ page.url | prepend: '/en' | relative_url }}">English</a></nav></div>
  <main id="main" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
